{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home{% endblock %} | Login Register Form</title>
    <link rel="stylesheet" href="{% static 'login_activity/css/style.css' %}">
</head>

<body>
    <main class="page">
        <section class="auth-card" aria-labelledby="page-title">
            {% if messages %}
            {% for message in messages %}
            <p class="message" role="status">{{ message }}</p>
            {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </section>
    </main>
</body>

</html>
